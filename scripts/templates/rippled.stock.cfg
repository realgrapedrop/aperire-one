# Stock mainnet xrpld config for an Aperire node.
#
# scripts/install-aperire-node.sh copies this file to <dir>/config/rippled.cfg
# on a fresh install and NEVER over an existing one. Edit the installed copy,
# not this template; the installer will leave your edits alone.
#
# Every stanza below is upstream's own shape, taken from
# XRPLF/rippled cfg/xrpld-example.cfg. The four deliberate departures from
# that example are marked DEPARTURE and each says why.
#
# Paths are CONTAINER paths. The compose template mounts <dir>/data at
# /var/lib/xrpld, so everything under it lands on the host and the dashboard
# can measure the store.

[server]
port_rpc_admin_local
port_peer
port_ws_admin_local

# Admin RPC. Loopback only, and the compose publishes it on 127.0.0.1 as
# well, so it is loopback at both layers. The dashboard's preflight reads
# this port number out of this stanza.
[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 127.0.0.1, 172.16.0.0/12
protocol = http

# DEPARTURE 1: the two admin ports bind 0.0.0.0 and allow admin from the
# docker bridge range, where upstream's example binds 127.0.0.1 and allows
# 127.0.0.1. Both halves are forced by the container, and neither widens what
# can reach the port.
#
# The bind: inside a container 127.0.0.1 is the CONTAINER's loopback. Docker's
# published port arrives on the container's bridge address, so a node bound to
# container-loopback answers nobody and the dashboard sees a node that is not
# there.
#
# The admin list: for the same reason, the source address rippled sees for a
# published-port connection is docker's bridge gateway, not 127.0.0.1. Docker
# allocates its bridge networks out of 172.16.0.0/12, which is one of the
# subnets upstream's own admin documentation gives as an example. 127.0.0.1 is
# kept beside it for the daemon configurations that preserve the source
# address instead of proxying.
#
# What keeps the port private is the compose line "127.0.0.1:5005:5005". That
# is a HOST boundary: nothing off this host can reach the port at all,
# whatever the process inside binds. admin = 0.0.0.0 would also work here and
# is deliberately not used, because upstream flags it with a security warning
# and a range costs nothing.

# Public peer port. 2459 is xrpld's compiled-in default and the compose maps
# host 51235 to it. Change one and you must change the other: a host port
# mapped to a container port nothing listens on refuses inbound peers, and
# nothing says why.
[port_peer]
port = 2459
ip = 0.0.0.0
protocol = peer

# Admin WebSocket. This is the port the dashboard subscribes to.
[port_ws_admin_local]
port = 6006
ip = 0.0.0.0
admin = 127.0.0.1, 172.16.0.0/12
protocol = ws
send_queue_limit = 500

[node_db]
type=NuDB
path=/var/lib/xrpld/db/nudb
nudb_block_size=4096
online_delete=32768
advisory_delete=0

# DEPARTURE 2: online_delete is 32768, not upstream's example 512.
# 512 ledgers is about half an hour of history, which is too little for the
# dashboard's Consensus and Network windows to have anything to read. 32768 is
# roughly a day and a half and is what the fleet's stock nodes run.
#
# DEPARTURE 3: exactly ONE advisory_delete line, and it is 0 (issue #81).
# The upstream example ships a commented "#online_delete=512" block that
# carries a SECOND advisory_delete=0 underneath the live one. rippled tolerates
# duplicate keys and picks one, so a tool that flips the first line to 1 while
# a trailing 0 remains restarts the node believing rotation is gated when it is
# not. Every fleet node carried that duplicate. This file carries one line.
#
# 0 means the node rotates its store on its own, unasked. That is correct on a
# fresh box, and it is deliberately not 1: advisory_delete=1 gates rotation
# behind the can_delete admin RPC, so setting it before a host has something
# to make that call means online_delete never runs and the store grows until
# the disk fills. Arm it later, together:
#
#   sudo bash scripts/enable-advisory-delete.sh <this file>
#   curl -fsSL https://get.aperire.one | bash -s -- --update --force
#
# The update also moves the host to the latest release. If it says it cannot find
# or name the node, name it first with `--node-wrapper <container>` (or
# `--node-wrapper-native <unit>`) in the same one-liner.
#
# and restart the node when no rotation is in flight.

[database_path]
/var/lib/xrpld/db

# DEPARTURE 4: the debug log lives under the mounted store, not upstream's
# /var/log/xrpld. Unmounted, it grows inside the container's writable layer
# where nothing can see it or rotate it. Here it is a file on the host.
[debug_logfile]
/var/lib/xrpld/log/debug.log

# Sized explicitly rather than left to auto-detection. xrpld inside a
# container reads the HOST's memory, not the container's limit, so an
# auto-sized node on a big host can size itself past the compose's mem_limit
# and be OOM-killed. medium suits a box with 16 GB or so; raise it through the
# Advisor's config change (node_size accepts tiny, small, medium, large, huge).
[node_size]
medium

# DEPARTURE 5: an absolute container path, where upstream's example uses a
# relative one. Relative resolves against the folder holding the config that is
# RUNNING, and the image's entrypoint copies /config/rippled.cfg to
# /etc/xrpld/xrpld.cfg before starting, so "validators.txt" would resolve
# somewhere this install does not mount. /config/validators.txt is a bind mount
# and is always there.
#
# This one is worth being sure about: with no publisher list a node still peers,
# still syncs, still reaches full, and never validates a ledger. Nothing about
# it looks wrong. The compose mounts validators.txt at exactly this path, and
# the two are asserted equal in scripts/test-install-aperire-node.sh.
[validators_file]
/config/validators.txt

# Keep the log quiet, or the debug log is the biggest thing on the disk.
[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1
