@REPO@/data/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    # Rotated logs must not be world-readable — the server logs can carry
    # peer hostnames/IPs, masked emails, and operator activity. `create`
    # sets the mode on any log file logrotate itself creates; the 0750
    # data/logs dir (set by install-aperire-service.sh) is the primary
    # guard since copytruncate copies in place rather than recreating.
    create 0640 @RUN_USER@ @RUN_USER@
    su @RUN_USER@ @RUN_USER@
}
