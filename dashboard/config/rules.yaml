# Aperire alert rules, the set the product ships.
#
# DO NOT EDIT THIS FILE. Every install and every update replaces it, so a
# change made here is lost the next time this host is updated, and a
# correction the product ships would be lost if it were not.
#
# Your changes go in `rules.local.yaml`, beside this file. It overrides these
# rules by metric + severity, and nothing but you ever writes it:
#
#     rules:
#       - metric: swap_used_pct      # change a threshold on this host
#         severity: warn
#         threshold: { op: ">=", value: 40 }
#
#       - metric: peer_count         # switch a shipped rule off
#         severity: warn
#         enabled: false
#
#       - metric: peer_count         # a rule of your own (needs op and value)
#         severity: critical
#         threshold: { op: "<", value: 2 }
#         duration: 300s
#         channels: [email]
#
# Then apply both files:
#     systemctl reload aperire-server
# (or send SIGHUP to the dashboard process).
#
# Seeded from METRICS-CATALOG.md.
#
# Schema:
#   - metric:     The catalog metric name. Must match a real metric.
#     severity:   warn | critical | page
#     threshold:
#       op:       ">="  | ">"  | "<="  | "<"  | "=="
#       value:    number
#     duration:   how long the threshold must hold before firing
#                 (suffix s | m | h, e.g. "60s", "5m")
#     channels:   list of channel ids defined in channels.yaml
#                 (empty list = log only, no notification)
#     action:         optional. One or two plain sentences: what to do
#                     about this rule firing, and why it matters. Shown on
#                     the alert row in Insights and in the notification.
#                     Per-rule, so a warn and a critical on the same metric
#                     can say different things. Max 400 characters.
#     action_command: optional. A single command line to copy and run.
#                     Max 200 characters.
#
# Both are instruction text and nothing more. Aperire never runs them, and
# never substitutes a live value into them, so write them as static lines:
# the alert already names the node, the threshold and the reading. A rule
# with no clear action is better left without one than given filler. When a
# rule has no action, the metric's entry in knowledge/metric-alerts.yaml is
# used instead.
#
# Tier semantics:
#   warn      one-shot. Fires once, resolves silently.
#   critical  one-shot. Fires once, resolves silently.
#   page      re-fires every 15 min while still firing until Acked.
#
# Convention: list rules from most-severe to least-severe per metric.

rules:

  # ── Compute / host health ──────────────────────────────────────────

  # Host CPU pinned at or above 95% for 5 minutes. Practically saturated
  #, rippled and the dashboard are competing for cycles, consensus
  # messages stop being processed in time. Duration matches the catalog
  # ("> 95% 10m"); 5 minutes catches incidents quickly without firing
  # on transient spikes. Raise to 98 if your workload runs hot.
  - metric: cpu_busy_pct
    severity: critical
    threshold: { op: ">=", value: 95 }
    duration: 300s
    channels: [email, ntfy]

  # Earlier CPU warning at sustained >=85% for two minutes. Catches
  # load creep before it crosses critical. Adjust up if your host
  # legitimately runs in this range during normal operation.
  - metric: cpu_busy_pct
    severity: warn
    threshold: { op: ">=", value: 85 }
    duration: 120s
    channels: [email]

  # Host memory at or above 90%, real risk of OOM-kill on the next
  # allocation spike. Lower for stricter headroom; raise only if your
  # workload genuinely needs to use almost all of RAM.
  - metric: mem_used_pct
    severity: critical
    threshold: { op: ">=", value: 90 }
    duration: 60s
    channels: [email, ntfy]

  # Memory pressure rising at >=80% sustained. Investigate before the
  # critical threshold trips. Tune to your host's normal memory profile.
  - metric: mem_used_pct
    severity: warn
    threshold: { op: ">=", value: 80 }
    duration: 120s
    channels: [email]

  # Half or more of swap is in use, sustained pressure has pushed pages
  # off RAM. A healthy validator host rarely swaps. Lower the threshold
  # for stricter alerting.
  - metric: swap_used_pct
    severity: critical
    threshold: { op: ">=", value: 50 }
    duration: 60s
    channels: [email, ntfy]

  # Swap in real use, for ten minutes.
  #
  # This was `> 0` for 5 minutes, which sounds cautious and is not. A Linux
  # host parks a little in swap and never reclaims it, shmem and tmpfs pages
  # that no process owns and nothing is waiting on. On this host that residue
  # is under a megabyte of sixteen gigabytes, and the rule fired on it
  # continuously for weeks. A rule that is always firing reports nothing, and
  # the operator learns to scroll past the one that matters.
  #
  # Raising it to 5% did not fix that either. A co-located validator host with
  # 92 GB of RAM at 30% used and 30% of swap held by old pages, `vmstat 1`
  # reading si=0 so=0 the whole time, fired on that 5% line for days. Nothing
  # was paging. The number on its own does not say whether swap is a resident
  # amount that has sat still for weeks or something actively climbing, and a
  # long-running Linux box almost always carries some of the first.
  #
  # 40% for ten minutes is well clear of that kind of residue on every host
  # this project has watched, and still ten points below the 50% critical
  # above, which is unchanged. What separates ordinary swap from a real
  # problem is not this rule alone: it is whether the number is climbing,
  # which the System tab's Memory & Swap chart shows over time, and whether
  # `vmstat 1` on the box itself reads si/so near zero (parked pages, nothing
  # to act on) or steadily nonzero (active paging, worth investigating).
  #
  # Both swap rules read /proc on the node that reported them, so `vmstat 1`,
  # `free -h` and any swappiness change belong on this node's own host, the
  # box the alert names, not the one whose dashboard is open. Unlike the relay
  # feed, this number is real on every host including an aggregator: it has a
  # kernel and it can swap, so a swap alert there is about that box and is
  # answered there.
  #
  # `scripts/set-alert-role-defaults.sh --swap-warn=N` still sets a different
  # number for one box, written once into `rules.local.yaml` and never
  # touched again, for an operator who wants stricter warning on a box that
  # runs the node. The shipped default below is now the same for every role.
  - metric: swap_used_pct
    severity: warn
    action: >-
      Steady swap that has sat at the same level for a while is ordinary on a
      long-running Linux host, on the node's own box included. What is worth
      acting on is swap that keeps climbing, or vmstat 1 showing si/so staying
      above zero: check both before treating this as a problem.
    threshold: { op: ">=", value: 40 }
    duration: 600s
    channels: [email]

  # ── ledger store growth ───────────────────────────────────────────
  #
  # The safety net behind the scheduled rotation window. A node with
  # `advisory_delete=1` only prunes when something calls `can_delete`,
  # which on an Aperire host is aperire-can-delete.timer, once a day. If
  # that timer is stopped, masked, failing, or was never installed after
  # advisory_delete went on, nothing prunes and the store grows until the
  # data mount is full. Nothing else would say so: the node stays healthy,
  # validates normally, and reports nothing wrong right up to the point it
  # cannot write.
  #
  # `nudb_mount_free_days` is how long the data mount lasts at the growth
  # fitted from the store's own peaks (lib/nudb-growth.ts). On a node that
  # is rotating it reads 3650: the store sawtooths, the fitted trend is flat
  # or negative, and the mount does not fill. It only falls when growth is
  # real and sustained, which is exactly the failure. Both thresholds match
  # the bands the System tab already colours, so the page and the alert
  # agree.
  #
  # advisory_delete is the operator's choice and both values are first
  # class (ruling 2026-08-27, #101): free-running (advisory_delete=0)
  # rotates the moment its own threshold crosses; gated (advisory_delete=1,
  # #79) waits for the daily can-delete window too, so its real cadence
  # often runs past 24h. A fit tied to calendar days read that deferral as
  # growth, warned, cleared when the rotation landed, and repeated the same
  # warn on the next gated cycle, a chronic re-fire on a store pruning
  # exactly as designed. The fit has no calendar in it once the store has
  # completed two rotations: it fits peak to peak on the store's OWN
  # cadence, gated or not, which is what makes the two thresholds below
  # correct in either mode without asking which mode this node runs.
  #
  # Written only where the dashboard can see the store: it needs
  # RIPPLED_DATA_PATH set (the installer sets it on a co-located host). On
  # an aggregator watching other nodes it is never written, and these rules
  # simply never fire.
  #
  # An hour of duration on both. The number is derived from a day-long
  # window, so it does not need catching in the first minute, and an hour
  # is long enough that a single odd walk cannot move it.
  - metric: nudb_mount_free_days
    severity: critical
    threshold: { op: "<=", value: 14 }
    duration: 3600s
    channels: [email, ntfy]
    action: >-
      Free space on the node's database volume, or add space to it. Two weeks
      is not long enough to order hardware, so treat this as the last window
      to act deliberately rather than under an outage. A full volume stops
      rippled writing and the node leaves the network.
    action_command: df -h && du -sh /var/lib/rippled/db/nudb

  # Two weeks earlier. At this point the fix is still "start the timer",
  # not "find disk".
  - metric: nudb_mount_free_days
    severity: warn
    threshold: { op: "<=", value: 30 }
    duration: 3600s
    channels: [email]
    action: >-
      Decide now how this volume gets more room, while there is still a month
      to arrange it. Lowering ledger_history shrinks the store but discards
      history the node can then no longer serve, so it is a real trade, not a
      free fix.

  # ── how the network sees this validator ───────────────────────────
  #
  # The only class of problem a node cannot detect about itself. One that has
  # gone invisible to every other operator still reports itself proposing,
  # with a full peer list and 100% local agreement, because from the inside
  # nothing is wrong.

  # Nobody has seen us sign for half an hour. A healthy validator is observed
  # continuously, so this is long enough to ride out a registry hiccup and
  # short enough to matter.
  - metric: validator_last_seen_age_s
    severity: critical
    threshold: { op: ">", value: 1800 }
    duration: 300s
    channels: [email, ntfy]

  # We have fallen out of the registry entirely. Distinct from the above: this
  # is "they have no record of us", not "the record is stale".
  - metric: validator_registry_seen
    severity: warn
    threshold: { op: "<", value: 1 }
    duration: 1800s
    channels: [email]

  # The registry advertises a different version than we run. Not an outage,
  # `last_seen` tracks observed validations while the version comes from the
  # manifest, so the two can disagree for a while after an upgrade. Worth
  # knowing because anyone reading the registry to decide whether to trust
  # this validator sees the stale one. Long hold, low severity.
  - metric: validator_version_drift
    severity: warn
    threshold: { op: ">=", value: 1 }
    duration: 86400s
    channels: [email]

  # A peer loss with a direction. peer_count alone falls the same way whether
  # the network shed you or your own box is in trouble, which is why telling
  # them apart used to mean reading three charts at once. The signal reads the
  # inbound and outbound counts separately and uses throughput as the
  # tie-breaker: 1 means outbound fell while inbound held and traffic rose,
  # the 31 July shape, the network, and 2 means both fell with traffic flat,
  # which nothing outside your host would do.
  #
  # Two rules rather than one, because the two cases want different urgency:
  # the network shedding you is worth knowing, your own box shedding peers is
  # worth looking at now. Ten minutes on both, the signal is deliberately
  # conservative, but a single sample should not page anyone.
  - metric: peer_shed_signal
    severity: warn
    threshold: { op: ">=", value: 1 }
    duration: 600s
    channels: [email]

  - metric: peer_shed_signal
    severity: critical
    threshold: { op: ">=", value: 2 }
    duration: 600s
    channels: [email, ntfy]

  # ── rippled load + queue ───────────────────────────────────────────

  # Page and critical both re-tuned 2026-09 (#114) from what stock-node1
  # actually saw: `load_factor` reads back once a minute, already averaged
  # over that minute (server.ts, perMinLoadFactor), so a duration here is a
  # count of one-minute averages, not raw ticks. The old 3-minute critical
  # (below) needed three such averages at 100+ to fire, and network fee
  # spikes were doing exactly that: two spikes reaching an averaged 586
  # (2026-08-29 and -30) crossed the 3-minute bar and then held roughly two
  # minutes more before dropping back under 100, a good five one-minute
  # averages above threshold end to end, all with CPU mid-band and peers
  # steady, no local cause. The Advisor proposed retuning this rule five
  # times on its own between 2026-08-14 and -30 (queued, untouched, in
  # stock-node1's Knowledge inbox) before this was picked up here.
  #
  # The value can't be the lever: 586 already clears any threshold worth
  # setting, so a real overload and a passing spike look the same by size
  # and differ only by how long they hold. Both durations below are simply
  # doubled from the 2026-04-27 tune, which keeps the same 3:5 ratio
  # between critical and page and puts both comfortably past the five
  # minutes these known spikes actually ran. Warn is untouched: it still
  # fires on these events at 80+/180s, which is the visibility the evidence
  # supports without the critical/page urgency they don't warrant. This is
  # arithmetic against the two known events, not a fresh multi-day study
  # like April's. If six or ten minutes still catches routine spikes, that
  # means longer ones are showing up, and these numbers need another look
  # with real data, not a further guess.
  #
  # Page, fee escalation sustained for ten minutes. Load factor at or
  # above 100 means rippled is actively rejecting RPCs and charging much
  # higher fees to shed work; ten minutes of that is a real emergency and
  # worth waking someone for.
  - metric: load_factor
    severity: page
    threshold: { op: ">=", value: 100 }
    duration: 600s
    channels: [email, ntfy]

  # Critical, fee escalation sustained for six minutes. rippled has been
  # rejecting transactions and bidding fees up long enough to warrant
  # notification, not a wake-up call, and long enough that the two known
  # network spikes (five minutes each, see above) no longer reach it.
  - metric: load_factor
    severity: critical
    threshold: { op: ">=", value: 100 }
    duration: 360s
    channels: [email, ntfy]

  # Warn, sustained 80x baseline load for 3 minutes. Fires only when
  # load is genuinely high for a meaningful stretch, not on the brief
  # 1-2 minute spikes that are normal XRPL network rhythm. Tuned
  # 2026-04-27 from earlier ≥32/120s after analysing 9 days of data:
  # 97% of the time the validator sits at idle (load=1), single-minute
  # spikes to 30+ are common (~10/day), but sustained 3-minute periods
  # at 80+ are rare (~0.2/day). This threshold + duration produces
  # roughly two alerts per nine days, only the events worth knowing.
  - metric: load_factor
    severity: warn
    threshold: { op: ">=", value: 80 }
    duration: 180s
    channels: [email]

  # Job queue transaction overflow, deliberately has no rule.
  #
  # `jq_trans_overflow` is a lifetime counter: rippled increments it every time
  # it drops a relayed transaction because the transaction job queue was already
  # full, and it only ever returns to zero when the process restarts. The rule
  # that used to sit here read `> 0` for 0s, which means it fired on the first
  # drop the node ever saw and then could never resolve, a permanent critical
  # on three healthy mainnet nodes, one of which had simply been up longer.
  #
  # The metrics catalog asks for "non-zero rate" and "rising", which is the
  # right signal and is not something a threshold on an absolute value can
  # express: no fixed number on a monotonic counter is ever event-like. A rule
  # that is always firing reports nothing, and the operator learns to scroll
  # past the one that matters (the same reasoning as the swap rule above).
  #
  # The number itself has not gone anywhere: the Consensus tab renders it on
  # the Job Queue card, and it is in the read API's node-status payload as
  # `job_overflow`. Watch it there, a step change in its slope is the real
  # signal, and it always was.

  # ── Network / peers ────────────────────────────────────────────────

  # Validator is partitioned, zero peer connections. Page tier; wakes
  # someone up. 30s duration so a brief network blip doesn't fire, but
  # genuine isolation gets caught fast. A validator with no peers is
  # signing in the dark.
  - metric: peer_count
    severity: page
    threshold: { op: "==", value: 0 }
    duration: 30s
    channels: [email, ntfy]

  # Critical, fewer than 5 peers for one minute means consensus
  # messages may arrive late or not at all. The validator will likely
  # start missing validations within minutes if this persists. Catalog
  # threshold for peer_count critical.
  - metric: peer_count
    severity: critical
    threshold: { op: "<", value: 5 }
    duration: 60s
    channels: [email, ntfy]

  # Fewer than 10 peer connections for 2+ minutes. Default rippled
  # config sits at peers_max=21 and the rippled field guide recommends
  # 15-30 as the healthy range, so <10 is a real thinness signal that
  # validations from your UNL may not reach you reliably. Don't raise
  # this above ~12, a validator at peers_max=21 hovers in the
  # mid-teens to low-20s and you'd alert on normal operation.
  - metric: peer_count
    severity: warn
    threshold: { op: "<", value: 10 }
    duration: 120s
    channels: [email]

  # ── If your validator peers with a fixed, deliberately small set ──
  #
  # The three thresholds above assume a node that dials the open network. A
  # validator run with `[peer_private] 1` and an `[ips_fixed]` list peers with
  # exactly the nodes you named and nothing else, by design, as a way to keep
  # its address off the public overlay. On a setup like that the stock rules
  # are wrong in the most useless direction: they fire on the intended state
  # and stay firing, so the alert can never tell you anything.
  #
  # This file is per-node, each dashboard reads its own copy, so edit the
  # two rules on THAT node only, and leave every other node's stock. For a
  # validator pinned to two proxies:
  #
  #     - metric: peer_count      # lost one of the two links it is pinned to;
  #       severity: critical      # no redundancy left, and the next loss is
  #       threshold: { op: "<", value: 2 }   # a partition
  #       duration: 60s
  #       channels: [email, ntfy]
  #
  # ...replacing BOTH the <5 critical and the <10 warn, and keeping the `== 0`
  # page rule exactly as it is: zero peers means the same thing at any size.
  # Set the value to the number of nodes you actually pinned, not to a number
  # that happens to be quiet today.

  # TCP retransmits at or above 50 per second for a minute. Usually
  # signals a network-path problem upstream, bad NIC, congested switch,
  # ISP issue. Tuned in 2026-04-27 audit from 10/s; high-traffic
  # validators can hit 10/s on healthy paths because the metric is
  # absolute, not a percentage of sent segments. Raise further if your
  # environment runs hot.
  - metric: tcp_retrans_per_sec
    severity: warn
    threshold: { op: ">=", value: 50 }
    duration: 60s
    channels: [email]

  # Median round-trip time to peers above 500ms, held for five minutes.
  #
  # The Advisor tab has drawn a red band at this exact number for as long as
  # it has had a Peer latency card, and until now that band was the only
  # place the number lived, a threshold in a page, with no rule behind it,
  # which meant the tab could show the card red while the Insights tab said
  # nothing was firing. The band and this rule are now the same number in the
  # same direction (`> 500`, not `>= 500`), so the two surfaces cannot
  # disagree about it.
  #
  # p50, not p90: a slow tail is normal on a well-connected node with fifty
  # peers scattered across the world, and firing on it teaches the operator
  # to ignore the alert. When the MEDIAN peer is half a second away, the
  # problem is this box's path to the network, not one distant peer.
  #
  # Five minutes because rising peer latency is a condition, not an event,
  # it precedes missed validations rather than accompanying a spike. Measured
  # on three mainnet nodes before this rule was written: median 7ms to 34ms,
  # worst sample 43ms, which is more than ten times under this threshold, so
  # a healthy node has no path to firing it. Raise it if you run behind a
  # deliberately long path (a VPN, a satellite link, a fixed set of distant
  # proxies) and the number below is simply what your setup costs.
  - metric: peer_latency_p50
    severity: critical
    threshold: { op: ">", value: 500 }
    duration: 300s
    channels: [email, ntfy]

  # ── Consensus health ───────────────────────────────────────────────

  # 1-hour agreement with the network has dropped below 95%. Your
  # validator is signing ledgers the network is rejecting, a serious
  # consensus problem. Page tier; needs immediate investigation. This
  # threshold should rarely be loosened, UNL inclusion depends on it.
  - metric: agreement_pct_1h
    severity: page
    threshold: { op: "<", value: 95 }
    duration: 60s
    channels: [email, ntfy]

  # Critical, agreement has dropped below 97%. Not yet page-worthy but
  # something is wrong with consensus participation. Likely a peer
  # connectivity problem or sync lag. Investigate within the hour.
  - metric: agreement_pct_1h
    severity: critical
    threshold: { op: "<", value: 97 }
    duration: 60s
    channels: [email, ntfy]

  # Earliest agreement warning, below 99% for two minutes. Healthy
  # validators sit at 100% with rare brief dips. A sustained dip below
  # 99% is the canary for an upstream problem (peers, load, sync).
  - metric: agreement_pct_1h
    severity: warn
    threshold: { op: "<", value: 99 }
    duration: 120s
    channels: [email]

  # 6 or more missed validations in the rolling 1h window. Usually a
  # stream gap, peer connectivity drop, or sync issue. Tuned in
  # 2026-04-27 audit from 10 down to 6 to honor the catalog spec
  # (catalog says > 5 = critical).
  - metric: missed_validations_1h
    severity: critical
    threshold: { op: ">=", value: 6 }
    duration: 60s
    channels: [email, ntfy]

  # 3 or more missed validations in the rolling 1h window. Early warning
  # before the critical threshold trips. Some occasional misses during
  # admin-WS reconnects are normal, sustained misses are not.
  - metric: missed_validations_1h
    severity: warn
    threshold: { op: ">=", value: 3 }
    duration: 120s
    channels: [email]

  # ── Relay / telemetry feed health ──────────────────────────────────

  # The validator relay (aperire-relay) has not reported host-network
  # telemetry for 60s+. Every Network-tab host metric (bandwidth, packets,
  # connections, TCP retransmits) flows ONLY through this feed, so when it
  # dies those charts silently go blank with no other signal.
  # relay_feed_age_s is written every sample tick and climbs whenever the
  # relay is silent, so this fires whether the relay crashed, was never
  # started, or the host rebooted without it. The 60s duration on
  # top of the 60s threshold tolerates the relay's reconnect backoff (which
  # caps at 60s) so a brief dashboard restart does not false-fire. This is a
  # monitoring-visibility gap, not a consensus emergency, the validator
  # itself is unaffected (read-only monitoring), hence critical, not page.
  #
  # Where to fix it: on this node's own host, the box the relay runs beside,
  # named by the alert row. Not on whichever dashboard you happen to be
  # reading. In a fleet the reader is often an aggregator, and an aggregator
  # that watches other nodes has no aperire-relay of its own, so
  # `systemctl status aperire-relay` there answers "unit not found" for a
  # fault that lives somewhere else entirely. This file has no remediation
  # field, the actions live in knowledge/metric-alerts.yaml, which the
  # Insights firing card reads, so the host has to be named there and here,
  # in the comment an operator reads while tuning the rule.
  - metric: relay_feed_age_s
    severity: critical
    threshold: { op: ">=", value: 60 }
    duration: 60s
    channels: [email, ntfy]

  # The node itself is unreachable, the dashboard cannot reach rippled at all
  # (a restart, a crash, a network cut). node_unreachable_s climbs while it is
  # down and is 0 when reachable, so an outage is what fires the alert, not a
  # kept last-good peer count that made a downed node read healthy. A planned
  # restart trips it too, and that is correct: the node IS unreachable for those
  # minutes, and Insights should say so rather than sit empty.
  # duration is 0s on purpose: node_unreachable_s IS the outage duration (0 when
  # reachable, climbing while down), so the threshold already carries the time.
  # A duration debounce on top double-counts it (30s + 30s = a warn that only
  # fired at ~60s of outage, so a node down 38s during a restart recorded
  # nothing, operator 2026-08-23). Fire at the threshold the value names.
  - metric: node_unreachable_s
    severity: critical
    threshold: { op: ">=", value: 180 }
    duration: 0s
    channels: [email, ntfy]
    action: >-
      Three minutes is longer than any normal restart, so treat the node as
      down rather than busy. Check the service is running on the node's own
      host, then read why it stopped. Every minute here is missed validations.
    action_command: sudo systemctl status rippled && sudo journalctl -u rippled -n 50 --no-pager

  # 15s, not 30: a node restart takes it off the network for ~28-40s (the
  # container recreate), which straddled a 30s line, so whether a restart
  # registered was a coin flip. 15s reliably catches a restart and any real
  # brief outage, and a healthy node rarely blips that long, so it is not
  # noisy (operator ruling 2026-08-24, #63).
  - metric: node_unreachable_s
    severity: warn
    threshold: { op: ">=", value: 15 }
    duration: 0s
    channels: [email]
    action: >-
      Expected if you just restarted the node, and it should clear on its own
      within a minute. If you did not restart anything, watch for it to resolve
      before acting: a brief blip is worth noting, not worth an intervention.

  # ── Fleet ───────────────────────────────────────────────────────────

  # A host in this fleet is not running the deploy the rest of it is.
  # fleet_deploy_divergent counts the hosts whose .deploy-ref differs from
  # the one the largest group is on, so 0 means every host that could say
  # said the same thing, and 1 means exactly one box was left behind.
  #
  # 30 minutes, and the duration is the whole point: a fleet update rolls
  # hosts one at a time, so the count is 1, 2, 1, 0 while the roll is in
  # flight, and a shorter duration would alert on every deploy. Only a gap
  # that outlives the roll is worth a message.
  #
  # warn, not critical: a box on an older deploy still monitors its node.
  # The fix is a human running the fleet update against the host named in
  # the FLEET card, never an automatic re-deploy on a validator box.
  #
  # Two things this rule deliberately does not do. It says nothing about
  # hosts that report no ref at all (an install the fleet tool never touched,
  # a dashboard older than the field, a peer that was not answering). Those
  # are counted as unknown, shown as unknown on their own row, and never
  # assumed to be current. And it only ever fires on an AGGREGATOR: the
  # metric is written on the host that watches the fleet, so a fleet with no
  # aggregator sees the per-host state on its NODES panel but gets no email.
  - metric: fleet_deploy_divergent
    severity: warn
    action: >-
      A host in this fleet is running an older deploy than the rest, so it is
      missing fixes the others have. The fleet view names which host. Update
      it from the dev box; never auto-update a validator host.
    action_command: Settings & Updates on that host, unfold Updates, press Check now, then Apply update.
    threshold: { op: ">=", value: 1 }
    duration: 1800s
    channels: [email]

  # ── Does this host still verify itself? ────────────────────────────────
  #
  # scripts/verify-after-restart.sh is the check an operator runs after a
  # reboot: services up, the node proposing, the validator token still closed,
  # both loopback endpoints answering. aperire-verify.timer runs it 30 minutes
  # after it starts, which is 30 minutes after a boot and 30 minutes after an
  # install, and once a day after that. The dashboard reads the report each
  # run leaves behind.
  #
  # The first two metrics are never written from a missing or unparseable
  # report. Absent is absent: a zero would be a claim that a run happened and
  # found nothing wrong, which is the one thing a file that is not there must
  # not say. The third one is that absence measured, and it is the only rule
  # here that can fire on a host that has never run the verifier at all.

  # Something the verifier checks is wrong, and has been for two hours.
  #
  # Two hours, and here is what that number is made of. The report only
  # changes when the verifier runs, so nothing between runs can make this
  # flicker: the duration is not smoothing a noisy signal, it is a window in
  # which a bad reading can be corrected. The correction it waits for is a
  # human one. After a reboot an operator runs the verifier by hand, and a
  # first run that failed because the node was still catching up passes on the
  # second, well inside two hours, with no alert sent.
  #
  # What this is NOT is "two consecutive runs". That would need a duration
  # past 24 hours, and a rule that is pending lives in the dashboard's memory
  # until it fires: a restart inside that day puts the clock back to zero, so
  # a genuinely broken host could stay quiet indefinitely on a box that gets
  # deployed to. A rule that cannot be relied on to fire is worse than one
  # that occasionally speaks early.
  #
  # warn, not critical: most of what the verifier finds has a metric of its
  # own that says it sooner and more precisely. This is the backstop for the
  # few that nothing else watches, a validator config left readable being the
  # one that matters.
  - metric: verify_failed_checks
    severity: warn
    action: >-
      This host's own after-restart verifier found something wrong and it has
      stayed wrong for two hours. Run the verifier by hand to see the failing
      line, then fix what it names. Each check prints its own remedy.
    action_command: bash scripts/verify-after-restart.sh
    threshold: { op: ">=", value: 1 }
    duration: 7200s
    channels: [email]

  # The verifier has stopped running.
  #
  # 26 hours: the timer's daily interval, plus room for the drift AccuracySec
  # allows and for a run that took its time. Past that, nothing has verified
  # this host in over a day, and the fault is not in what the last run found,
  # it is that nothing is checking any more. A masked timer, a unit that fails
  # on start, or an account that can no longer write the report all look like
  # this and like nothing else. Changing OnUnitActiveSec in
  # scripts/aperire-verify.timer means changing this number with it.
  #
  # duration 0s on purpose, the same reasoning as node_unreachable_s above:
  # the value IS the elapsed time, so the threshold already carries the wait.
  #
  # This is the rule that makes the whole thing worth having. Without it a
  # timer that quietly stopped leaves the last good report sitting there and
  # the host reads green forever, on a check that no longer happens.
  - metric: verify_report_age_s
    severity: warn
    action: >-
      The verifier has not run in over a day, so nobody is checking this host,
      and green here means unchecked, not healthy. See whether the timer is
      alive, and start it if it stopped.
    action_command: systemctl status aperire-verify.timer && sudo systemctl start aperire-verify.service
    threshold: { op: ">=", value: 93600 }
    duration: 0s
    channels: [email]

  # The verifier is installed here and has never left a report.
  #
  # The gap the two rules above could not see. Both read the report, so on a
  # host with no report they have nothing to fire on: the age cannot age from
  # a stamp that does not exist. A box installed and never rebooted sat that
  # way indefinitely, unverified, reading green because nothing was reading
  # anything (#143).
  #
  # An hour. The timer's first run is 30 minutes after it starts, so a fresh
  # install writes 1 for half an hour and then a report lands and it goes to
  # 0. An hour is that with room, and past it the first run did not happen:
  # the timer is not running, or the service failed on start, or the account
  # cannot write the report.
  #
  # This can only fire where /etc/systemd/system/aperire-verify.timer exists.
  # A dashboard running from a source tree writes nothing here, because a
  # missing report is not a fault on a host that never installed the thing
  # that writes it.
  - metric: verify_report_missing
    severity: warn
    action: >-
      This host installs the verifier but has never left a report, so nothing
      has checked whether it is running correctly. The first run is due 30
      minutes after the timer starts. See whether the timer is running and
      whether its last run failed.
    action_command: systemctl list-timers --all aperire-verify.timer && journalctl -u aperire-verify.service -n 20 --no-pager
    threshold: { op: ">=", value: 1 }
    duration: 3600s
    channels: [email]

  # ── Amendments ──────────────────────────────────────────────────────────
  #
  # An amendment this build does NOT support, already holding the network's
  # 80% majority. rippled activates a majority amendment 14 days after it
  # first holds and keeps that majority; this build then stops participating
  # in every transaction the amendment touches (`amendment_blocked`, its own
  # alert-free field in server_info). Nothing warned ahead of that until
  # #654: the prod validator sat there from 2026-09-25 to the day this was
  # written with no alert anywhere, an operator finding out from an X post
  # rather than from Aperire (issue #654).
  #
  # unsupported_amendment_days_to_block is written on every poll of
  # `feature`, at a large constant when nothing qualifies (see
  # NO_UNSUPPORTED_MAJORITY_DAYS, lib/amendments.ts) — always a fresh sample,
  # so the rule clears itself the moment support returns, the amendment's own
  # majority is lost, or an upgrade lands before the window closes, rather
  # than being stuck on the last countdown it saw.
  #
  # Two stages, the same "decide now, then again once it is urgent" shape
  # nudb_mount_free_days uses. Warn fires the moment majority is reached (the
  # metric starts its countdown at 14 exactly), critical at 3 days out, when
  # "plan an upgrade" becomes "do it this week". 1h duration: this reading
  # only moves once a day in practice (fourteen possible values over the
  # whole window), so nothing is lost by not reacting inside the first poll,
  # and a duration this long means one transient rippled read cannot open or
  # close the rule on its own.
  - metric: unsupported_amendment_days_to_block
    severity: critical
    threshold: { op: "<=", value: 3 }
    duration: 3600s
    channels: [email, ntfy]
    action: >-
      An amendment this build does not support activates within three days.
      Once it does, this node stops processing every transaction that
      amendment touches. Open the Governance tab for its name and exact
      activation time, and upgrade before then — see the Advisor's Operations
      card if one is attached.
    action_command: Governance tab on this dashboard, Amendment Status card

  - metric: unsupported_amendment_days_to_block
    severity: warn
    threshold: { op: "<=", value: 14 }
    duration: 3600s
    channels: [email]
    action: >-
      An amendment this build does not support just reached the network's
      majority. It activates in about two weeks unless this node is upgraded
      first, or the network's support for it falls back below the bar. Open
      the Governance tab for its name and exact activation time, and plan the
      upgrade now while there is still time to do it deliberately.
    action_command: Governance tab on this dashboard, Amendment Status card

