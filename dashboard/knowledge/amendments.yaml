# Aperire amendments knowledge library
#
# Auto-generated from https://xrpl.org/resources/known-amendments
# Refreshed daily, on demand when xrpscan reveals a new amendment hash
# with no description yet, and once at process startup regardless of
# whether this host runs a local node. Hand-edits are overwritten on
# next refresh, fork the URL or remove the cron if you need to
# maintain custom copy.

refreshed_at: "2026-09-29T00:01:23.947Z"

00C1FC4A53E60AB02C864641002B3172F38677E29C26C5406685179B37E1EDAC:
  description: "Changes the signature requirements for the XRP Ledger protocol so that non-fully-canonical signatures are no longer valid in any case. This protects against transaction malleability on all transactions, instead of only transactions with the tfFullyCanonicalSig flag enabled."

0285B7E5E08E1A8E4C15636F0591D87F73CB6A7B6452A932AD72BBC8E5D1CBE3:
  description: "This amendment fixes an off-by-one error that occurred in some corner cases when determining which NFTokenPage a NFToken object belongs on. It also adjusts the constraints of NFTokenPage invariant checks, so that certain error cases fail with a suitable error code such as tecNO_SUITABLE_TOKEN_PAGE instead of failing with a tecINVARIANT_FAILED error code."

03BDC0099C4E14163ADA272C1B6F6FABB448CC3E51F522F978041E4B57D9158C:
  description: "This amendment adds a check to the NFTokenAcceptOffer transaction to see if the buyer's number of objects owned in the ledger changes. Without this amendment, an account could accept an NFT offer even if they did not meet the reserve requirement after doing so. With this amendment, accepting the offer fails if their reserve is below the necessary amount."

07D43DCE529B15A10827E5E04943B496762F9A88E3268269D69C44BE49E21104:
  description: "Replaces the SusPay and CryptoConditions amendments."

08DE7D96082187F6E6578530258C77FAABABE4C20474BDB82F04B021F1A68647:
  description: "Creates \"Payment Channels\" for XRP. Payment channels are a tool for facilitating repeated, unidirectional payments or temporary credit between two parties. This feature is expected to be useful for the Interledger Protocol. One party creates a Payment Channel and sets aside some XRP in that channel for a predetermined expiration. Then, through off-ledger secure communications, the sender can send \"Claim\" messages to the receiver. The receiver can redeem the Claim messages before the expiration, or choose not to in case the payment is not needed. The receiver can verify Claims individually without actually distributing them to the network and waiting for the consensus process to redeem them, then redeem the combined content of many small Claims later, as long as it is within the expiration."

0F48FF561C709540328F31F1C97FD512ACC8B4E42138A161CB0E21ECA292540B:
  description: "Allows accounts to delegate some permissions to other accounts. This amendment replaces PermissionDelegation, fixing a critical bug discovered in the original implementation of the feature. Standard: XLS-75."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/tree/master/XLS-0075-permission-delegation"

12523DF04B553A0B1AD74F42DDB741DE8DC06A03FC089A0EF197E2A87F1D8107:
  description: "This amendment fixes the improper handling of large synthetic AMM offers in the payment engine. Due to the importance of this fix, the default vote in the source code has been set to YES."

138B968F25822EFBF54C00F97031221C47B1EAB8321D93C7C2AEAF85F04EC5DF:
  description: "Extends escrow functionality to fungible tokens, enabling Trust Line Tokens and Multi-Purpose Tokens (MPTs) to be held in escrow. Issuers can control whether their tokens can be escrowed through flags. To issue Trust Line Tokens, issuers must enable the Allow TrustLine Locking flag on their account, or the Can Escrow and Can Transfer flags for an MPT issuance."
  xls_url: "https://xls.xrpl.org/xls/XLS-0085-token-escrow.html"

1562511F573A19AE9BD103B5D6B9E01B3B46805AEC5D3C4805C902B514399146:
  description: "Although this amendment is enabled, it has no effect unless the SusPay amendment is also enabled. The SusPay amendment was replaced by the Escrow amendment, so the CryptoConditions amendment has no effect."

157D2D480E006395B76F948E3E07A45A05FE10230D88A7993C71F97AE4B1F2D1:
  description: "Introduces \"Checks\" to the XRP Ledger. Checks work similarly to personal paper checks. The sender signs a transaction to create a Check for a specific maximum amount and destination. Later, the destination can cash the Check to receive up to the specified amount. The actual movement of money only occurs when the Check is cashed, so cashing the Check may fail depending on the sender's current balance and the available liquidity. If cashing the Check fails, the Check object remains in the ledger so it may be successfully cashed later."

15D61F0C6DB6A2F86BCF96F1E2444FEC54E705923339EC175BD3E517C8B3FF91:
  description: "This amendment fixes an issue with approving trustlines after a user enables the lsfDisallowIncomingTrustline flag on their account."

1CB67D082CF7D9102412D34258CEDB400E659352D3B207348889297A6D90F5EF:
  description: "Introduces Credentials, a set of tools for managing authorization and compliance requirements using the XRP Ledger. Adds three new transaction types for managing credentials: CredentialCreate transaction - Create a credential in the ledger; CredentialAccept transaction - Accept a credential issued to you; CredentialDelete transaction - Delete a credential from the ledger; DepositPreauth transaction - Authorizes deposits to your account. Modified to allow credential-based authorization; CredentialIDs field - Credentials to prove authorization to deposit money. Added to Payment, EscrowFinish, PaymentChannelClaim, and AccountDelete transaction types; Credential ledger entry - Stores a credential in the ledger; DepositPreauth ledger entry - Records authorization for depositing to a specific account; modified to allow for credential-based authorization."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/tree/master/XLS-0070-credentials"

1D3463A5891F9E589C5AE839FFAC4A917CE96197098A1EF22304E1BC5B98A454:
  description: "Fixes a bug where validators could build consensus ledgers with different timestamps, potentially delaying the process of declaring validated ledgers. The circumstances for this to occur require precise timing, so this bug is unlikely to happen outside of controlled test conditions."

1E7ED950F2F13C4F8E2A54103B74D57D5D298FFDBD005936164EE9E6484C438C:
  description: "Fixes two bugs in Automated Market Maker (AMM) transaction processing: Fixes a bug that causes AMMWithdraw to not properly apply a reserve check before creating trust lines in some cases; Fixes a bug in payment processing that causes cross-currency payments not to use the full amount of liquidity available from the combination of AMM and order books in some cases."

1F4AFA8FA1BC8827AD4C0F682C03A8B671DCDF6B5C4DE36D44243A684103EF88:
  description: "Allows validators to include a new optional field in their validations to attest to the hash of the latest ledger that the validator considers to be fully validated. The consensus process can use this information to increase the robustness of consensus."

2110E4A19966E2EF517C0A8C56A5F35099D7665B0BB89D7B126B30D50B86AAD5:
  description: "Provides institutional-grade privacy for Multi-Purpose Tokens (MPTs) using advanced cryptography (EC-ElGamal and ZKPs). Individual balances and transfer amounts remain shielded from the public ledger while maintaining compliance mechanisms for authorized parties (issuers, auditors, or designated entities) to verify total supply and meet regulatory obligations."
  xls_url: "https://opensource.ripple.com/docs/xls-96-confidential-transfers"

21B8D2F76F68E11E9C077A43BBBC394136E9987E99DDB73966DD68419467E431:
  description: "This amendment is a collection of fixes for Single Asset Vaults, the Lending Protocol, the permissioned DEX, Multi-Purpose Tokens, and permissioned domains: Adds precision and rounding fixes for Single Asset Vaults and the Lending Protocol; Fixes the ValidPermissionedDEX invariant firing on a valid offer deletion; Validates non-canonical Multi-Purpose Token amounts; Adds a zero DomainID check for permissioned domains; Adds invariant AccountRootsDeletedClean, which checks that a deleted account doesn't leave any directly accessible artifacts behind."

25BA44241B3BD880770BFA4DA21C7180576831855368CBEC6A3154FDE4A7676E:
  description: "Fixes a bug where certain XRP endpoints were not checked when detecting circular paths."

267624F8F744C4A4F1B5821A7D54410BCEBABE987F0172EE89E5FC4B6EDBC18A:
  description: "This amendment fixes an issue where inner transactions of a Batch transaction would be flagged as having valid signatures. Since inner transactions aren't signed directly, they should never have valid signatures."

27CD95EE8E1E5A537FF2F89B6CEB7C622E78E9374EBD7DCBEDFAE21CD6F16E0A:
  description: "Adjusts rounding to prevent order books from being blocked by reduced offers whose exchange rate is affected by rounding of the remaining amounts."

2BF037D90E1B676B17592A8AF55E88DB465398B4B597AE46EECEE1399AB05699:
  description: "This amendment ensures that reward shares for cross-chain transactions are always rounded down. This preserves the original intended behavior."

2CD5286D8D687E98B41102BDD797198E81EA41DF7BD104E6561FEB104EFF2561:
  description: "Fixes a bug in auto-bridging that can leave a dry offer in the XRP Ledger. A dry offer is an offer that, if crossed, cannot yield any funds."

2E2FB9CF8A44EB80F4694D38AADAE9B8B7ADAFD2F092E10068E61C98C4F092B0:
  description: "Simplifies and unifies the code for decimal floating point math. In some cases, this provides slightly better accuracy than the previous code, resulting in calculations whose least significant digits are different than when calculated with the previous code. The different results may cause other edge case differences where precise calculations are used, such as ranking of Offers or processing of payments that use several different paths."

3012E8230864E95A58C60FD61430D7E1B4D3353195F2981DC12B0C7C0950FFAC:
  description: "Streamlines the offer crossing logic in the XRP Ledger's decentralized exchange. Uses the updated code from the Flow amendment to power offer crossing, so OfferCreate transactions and Payment transactions share more code. This has subtle differences in how offers are processed: Rounding is slightly different in some cases; Due to differences in rounding, some combinations of offers may be ranked higher or lower than by the old logic, and taken preferentially; The new logic may delete more or fewer offers than the old logic. (This includes cases caused by differences in rounding and offers that were incorrectly removed as unfunded by the old logic.)."

303ACB16CF8DBD3B5C34F131A9D19A7DE01AE05F480A8A682B869D1B4AAC8CFC:
  description: "This amendment is a collection of fixes for NFTs, Permissioned Domains, Vaults, and the Lending Protocol: Fixes an issue with expired NFTokenOffer entries remaining on the ledger. With this amendment enabled, using the NFTokenAcceptOffer transaction on an expired NFTokenOffer now deletes it as part of transaction processing; Adds an invariant check to ensure Permissioned Domains aren't modified by failed transactions; Fixes a trust line token limit check that was skipped when withdrawing vault assets. With this amendment enabled, VaultWithdraw transactions that specify either vault shares or vault assets will respect the trust line token limit of the destination address; Fixes a VaultClawback transaction with an Amount of 0 recovering more assets than the vault had available when the vault had an outstanding loan. With this amendment enabled, a zero-amount clawback is clamped to the vault's AssetsAvailable balance, the same as a non-zero amount; Fixes loan accounting information not updating in its associated Loan, LoanBroker, and Vault entries if the loan was defaulted, impaired, or unimpaired; Changes a LoanPay error to return tecNO_PERMISSION instead of temINVALID_FLAG when attempting to overpay on a loan that doesn't permit overpayments; Adds an additional check for LoanBroker invariants to ensure the listed CoverAvailable exactly matches the assets held in the associated pseudo-account."

30CD365592B8EE40489BA01AE2F7555CAC9C983145871DC82A42A31CF5BAE7D9:
  description: "Makes it possible to delete accounts."

31E0DA76FB8FB527CADCDF0E61CB9C94120966328EFA9DCA202135BAF319C0BA:
  description: "This amendment adjusts rounding in an additional case that can cause an order book to become blocked by a \"reduced\" offer. This addresses the same symptoms as the fixReducedOffersV1 amendment, but in an additional case that was not covered by that amendment."

3298D47E1F3A8A24FECAA30F699B8FE1DD234E072834BA099AD8180FFCE0FEC4:
  description: "This amendment is a collection of fixes for Single Asset Vaults, the Lending Protocol, Automated Market Makers, the permissioned DEX, Checks, and pseudo-accounts: Unifies freeze and deep freeze checks for transfers to and from pseudo-accounts in the VaultDeposit, VaultWithdraw, AMMDeposit, AMMWithdraw, LoanBrokerCoverDeposit, and LoanBrokerCoverWithdraw transactions; Changes CheckCash and CheckCancel to reject an all-zero CheckID with temMALFORMED during preflight instead of tecNO_ENTRY during processing; Fixes hybrid offers being removed from the open order book when the account that placed them loses access to the permissioned domain; Fixes Automated Market Maker liquidity being included in quality estimates for permissioned DEX order books; Changes AMMWithdraw to return tecAMM_FAILED instead of dividing by zero for the one EPrice value at which the computation's denominator becomes zero. Without this amendment, the division throws and the transaction fails with tefEXCEPTION; Adds a precision loss check to AMMDeposit, AMMWithdraw, and AMMClawback when the fixAMMv1_3 amendment is also enabled; Changes the ValidAMM invariant to ensure an AMM can only be deleted by an AMMWithdraw, AMMClawback, or AMMDelete transaction; Adds invariant ObjectHasPseudoAccount, which checks that deleting a ledger entry backed by a pseudo-account also deletes that pseudo-account; Adds further precision and rounding fixes for Single Asset Vaults and the Lending Protocol (and 3 more)"

32A122F1352A4C7B3A6D790362CC34749C5E57FCE896377BFDC6CCD14F6CD627:
  description: "Adds native support for non-fungible tokens, including fixes to several issues that were discovered after NonFungibleTokensV1."

32B8614321F7E070419115ABEAB1742EA20F3E3AF34432B5E2F474F8083260DC:
  description: "Fixes an accounting error in MPT escrows. Specifically, when an escrow unlocks MPTs that have a transfer fee, the system incorrectly reduces the MPT issuer's locked token balance by the gross amount (without fees) rather than the net amount (with fees). This leads to discrepancies in the token's total supply accounting."

3318EA0CF0755AF15DAC19F2B5C5BCBFF4B78BDD57609ACCAABE2C41309B051A:
  description: "This amendment fixes an issue introduced in the FlowCross amendment. Offers with the tfFillOrKill flag set and tfSell not set will fail if the exchange rate on the offer is better than, but doesn't exactly match, the order book rate."

35291ADD2D79EB6991343BDA0912269C817D0F094B02226C1C14AD2858962ED4:
  description: "Fixes AMM offer rounding and low quality order book offers from blocking the AMM."

36799EA497B1369B170805C078AEFE6188345F9B3E324C21E9CA3FF574E3C3D6:
  description: "This amendment fixes a bug in the NonFungibleTokensV1 amendment code where NFTs could be traded for negative amounts of money. Without this fix, users could place and accept an offer to buy or sell a NFToken for a negative amount of money, which resulted in the person \"buying\" the NFT also receiving money from the \"seller\". With this amendment, NFT offers for negative amounts are considered invalid."

3C43D9A973AA4443EF3FC38E42DD306160FBFFDAB901CD8BAA15D09F2597EB87:
  description: "Adds native support for non-fungible tokens. Standards Draft: XLS-20d."

3CBC5C4E630A1B82380295CDA84B32B49DD066602E74E39B85EF64137FA65194:
  description: "Provides users of deposit authorization with a way to preauthorize specific senders so those senders are allowed to send payments directly."

41765F664A8D67FF03DDB1C1A893DE6273690BA340A6C2B07C8D29D0DD013D3A:
  description: "This amendment removes the directory page limit. Object reserve requirements provide enough incentive to avoid creating unnecessary objects on the XRP Ledger."

42426C4D4F1009EE67080A9B7965B44656D7714D104A72F9B4369F97ABF044EE:
  description: "Changes the way the transaction cost applies to proposed transactions. Modifies the consensus process to prioritize transactions that pay a higher transaction cost."

42EEA5E28A97824821D4EF97081FE36A54E9593C6E4F20CBAE098C69D2E072DC:
  description: "Fixes a minor bug in transaction processing that causes failures when trying to prepare certain payment paths for processing. As a result, payments could not use certain paths that should have been valid but were invalidly prepared. Without this amendment, those payments are forced to use less-preferable paths or may even fail."

452F5906C46D46F407883344BFDD90E672B672C5E9943DB4891E3A34FEEEB9DB:
  description: "Fixes an edge case in deserializing Amount-type fields. Without this amendment, in some rare cases the operation could result in otherwise valid serialized amounts overflowing during deserialization. With this amendment, the XRP Ledger detects error conditions more quickly and eliminates the problematic corner cases."

47C3002ABA31628447E8E9A8B315FAA935CE30183F9A9B86845E469CA2CDC3DF:
  description: "Provides options to categorically block incoming Checks, Payment Channels, NFTokenOffers, and trust lines from reaching your account. When an account has these options enabled, other accounts cannot create those types of objects with the account as the destination."

4C97EBA926031A7CF7D7B36FDE3ED66DDA5421192D63DE53FFB46E43B9DC8373:
  description: "Introduces multi-signing as a way to authorize transactions. Creates the SignerList ledger object type and the SignerListSet transaction type. Adds the optional Signers field to all transaction types. Modifies some transaction result codes."

4F46DF03559967AC60F2EB272FEFE3928A7594A45FF774B87A7E540DB0F8F068:
  description: "Fixes a bug that could cause an amendment to achieve a majority and later activate with support of slightly less than 80% of trusted validators due to rounding semantics."

532651B4FD58DF8922A49BA101AB3E996E5BFBF95A913B3E392504863E63B164:
  description: "Changes the way Offers are ranked in order books, so that currency issuers can configure how many significant digits are taken into account when ranking Offers by exchange rate. With this amendment, the exchange rates of Offers are rounded to the configured number of significant digits, so that more Offers have the same exact exchange rate. The intent of this change is to require a meaningful improvement in price to outrank a previous Offer. If used by major issuers, this should reduce the incentive to spam the ledger with Offers that are only a tiny fraction of a percentage point better than existing offers. It may also increase the efficiency of order book storage in the ledger, because Offers can be grouped into fewer exchange rates."

565B90CA1AB2B9D42208ED10884188C64F9E19083DECB9634AAF06EB03299509:
  description: "The Lending Protocol enables on-chain, fixed-term, uncollateralized loans using pooled funds from a Single Asset Vault. This implementation relies on off-chain underwriting and risk management to assess the creditworthiness of borrowers, but offers configurable, peer-to-peer loans."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/tree/master/XLS-0066-lending-protocol"

56B241D7A43D40354D02A9DC4C8DF5C7A1F930D92A9035C4E12291B3CA3E1C2B:
  description: "For regulatory purposes, some issuers must have the ability to recover issued tokens after they are distributed to accounts. For example, if an issuer were to discover that tokens were sent to an account sanctioned for illegal activity, the issuer could recover, or claw back the funds."

586480873651E106F1D6339B0C4A8945BA705A777F3F4524626FF1FC07EFE41D:
  description: "Reduces the owner reserve counted against your XRP Ledger account when it owns a multi-signing SignerList."

58BE9B5968C4DA7C59BA900961828B113E5490699B21877DEF9A31E9D0FE5D5F:
  description: "Adds delivered amount to metadata for CheckCash transactions cashed for a flexible amount. (Has no effect unless the Checks amendment is enabled.)"

58E92F338758479C06084E1B6BA366BAD8F75E5329A7F0EEAFFFDA51E5106B7F:
  description: "Extends Multi-Purpose Tokens by making specific properties mutable by default: the on-chain metadata, the transfer fee, and the ability to enable MPT issuance capability flags. Issuers can make any of these properties permanently immutable by declaring them in the ImmutableFlags field."

5CC22CFF2864B020BD79E0E1F048F63EF3594F95E650E43B3F837EF1DF5F4B26:
  description: "This is a previous version of the Flow amendment. It was rejected due to a bug and removed in version 0.33.0."

5D08145F0A4983F23AFFFF514E83FAD355C5ABFBB6CAB76FB5BC8519FF5F33BE:
  description: "Changes how Payment transactions consume offers to remove a minor difference in how payment processing and offer processing consume liquidity. (Also affects how OfferCreate transactions are processed if FlowCross is enabled.)"

5E9586DB3D765B4C5794658FB6BB385071E9838DF4016027E6E26820C8526724:
  description: "Fixes an accounting error that can occur when performing an AMMClawback transaction on the last LP token holder. Due to rounding errors, the LPTokenBalance of the AMM may not match the holder's trust line balance. This amendment adjusts the LPTokenBalance to match the trust line balance before the clawback, so invariant checks pass without errors."

6143A27B71F7DAF9330ECA7C5EC3D54C8083A4FDEF7016737EEC06AB61E82EE0:
  description: "This amendment adds fields to ledger entries in cases where those fields are part of the identifying information that forms their ledger entry ID: Add a Sequence field to Escrow and PayChannel entries; Add an Owner field to SignerList entries; Add an OracleDocumentID field to Oracle entries."

621A0B264970359869E3C0363A899909AAB7A887C8B73519E4ECF952D33258A8:
  description: "Changes the PaymentChannelCreate transaction type so that it adds new payment channels to the recipient's owner directory. Without this amendment, new payment channels are added only to the sender's owner directory; with this amendment enabled, newly-created payment channels are added to both owner directories. Existing payment channels are unchanged."

677E401A423E3708363A36BA8B3A7D019D21AC5ABD00387BDBEA6BDE4C91247E:
  description: "Creates Permissioned DEXes, controlled environments for trading within the XRP Ledger's decentralized exchange (DEX). Trading in a permissioned DEX works like trading in the open DEX, except that a permissioned domain controls who can place and accept offers."

6781F8368C4771B83E8B821D88F580202BCB4228075297B19E4FDC5233F1EFDC:
  description: "Allows pre-authorization of accounting relationships (zero-balance trust lines) when using Authorized Trust Lines."

67A34F2CF55BFC0F93AACD5B281413176FEE195269FA6D95219A2DF738671172:
  description: "Fixes a bug that resulted in transaction processing not using new STAmountCalcSwitchovers code when the FeeEscalation amendment is enabled."

6C92211186613F9647A89DFFBAB8F94C99D4C7E956D495270789128569177DA1:
  description: "Fixes a bug in transaction processing that causes some invalid PaymentChannelClaim transactions to fail with the wrong error code. Without this amendment, the transactions have a tec-class result code despite not being included in a ledger."

7117E2EC2DBF119CA55181D69819F1999ECEE1A0225A7FD2B9ED47940968479C:
  description: "Changes Escrow to fix the following issues: Changes the EscrowCreate transaction to require the Condition or FinishAfter field (or both). Escrows with neither Condition nor FinishAfter that were created before this amendment can be finished by anyone at any time before their CancelAfter time; Fixes a flaw that incorrectly prevents time-based Escrows from being finished in some circumstances."

726F944886BCDF7433203787E93DD9AA87FAB74DFE3AF4785BA03BEFC97ADA1F:
  description: "Allows tokens with clawback enabled to be used in Automated Market Makers (AMMs). Adds a new transaction: AMMClawback - allows an issuer to claw back tokens that have been deposited in an AMM, if the token has clawback enabled."

73761231F7F3D94EC3D8C63D91BDD0D89045C6F71B917D1925C01253515A6669:
  description: "This amendment combines several bug fixes to NFTs: Fix Unburnable NFT: Without this amendment, an NFT cannot be burned when it has over 500 offers. With this amendment, an attempt to burn the NFT deletes up to 500 offers at a time, leaving any remaining offers \"orphaned\" in the ledger; Fix erroneous insufficient funds when brokering: Without this amendment, an account is unable to broker a deal due to an erroneous insufficient funds condition if the broker does not hold at least the purchase price of the NFT. With this amendment, the deal can succeed because only the buyer, not the broker, needs to hold the purchase amount; Fix transfer fee not accounted for in purchase: Without this amendment, if a buyer pays for an NFT using a trust line token with a transfer fee, but the buyer has insufficient funds to cover the transfer fee, their balance of a trust line token can go negative by the amount of the transfer fee in violation of the token issuer's limit. With this amendment, the buyer must hold enough to pay the purchase price and the transfer fee; Allow issuers to buy and sell NFTs for their own tokens: Without this amendment, issuers could not use their own trust line tokens to buy and sell NFTs. With this amendment, issuers can buy and sell NFTs using their own trust line tokens (and 2 more)"

740352F2412A9909880C23A559FCECEDA3BE2126FED62FC7660D628A06927F11:
  description: "Replaces the payment processing engine with a more robust and efficient rewrite called the Flow engine. The new version of the payment processing engine is intended to follow the same rules as the old one, but occasionally produces different results due to floating point rounding. This Amendment supersedes the FlowV2 amendment."

755C971C29971C9F20C6F080F2ED96F87884E40AD19554A5EBECDCEC8A1F77FE:
  description: "This amendment adds an additional check to prevent empty DID ledger entries from being created."

75A7E01C505DD5A179DFE3E000A9B6F1EDDEB55A12F95579A23E15B15DC8BE5A:
  description: "Changes OfferCreate transactions so that if an Offer uses tfImmediateOrCancel and transaction processing kills the Offer without moving any funds, the transaction uses the result code tecKILLED instead of tesSUCCESS. If the Offer exchanges any amount of funds, even a small amount, the transaction still uses tesSUCCESS. There are no other changes to the processing of the transaction (for example, in terms of whether it cleans up expired and unfunded Offers that were encountered in the ledger during transaction processing)."

763C37B352BE8C7A04E810F8E462644C45AFEAD624BF3894A08E5C917CF9FF39:
  description: "Fixes two bugs relating to the handling of NFT transfer fees and trust lines: Adds a check to NFTokenAcceptOffer transactions to ensure that the minter has a trust line to accept the transfer fee. Without this amendment, the check only applies when an NFT trade offer is created, not when the offer is accepted; as a result, if a necessary trust line is removed in between creating and accepting the offer, the trust line is inappropriate re-created when the offer is accepted. With this amendment, the transaction to accept the NFT trade offer fails if the minter no longer has a trust line to accept the transfer fee. (For more detail, see issue #4925.); Adjusts a check for the presence of a trust line when the minter of the NFT is also the issuer of the fungible token that would be paid as a transfer fee. Without this amendment, the NFTokenCreateOffer transaction fails with the result code tecNO_LINE if the NFT in question has a transfer fee, the offer amount is denominated in fungible tokens issued by the minter, and the account placing the offer does not have a trust line for those tokens. With the amendment, the offer can be created successfully. (For more detail, see issue #4941.)."

78ECD9CE17B0BF5B83BB3B275921FB5F5E0F672E9D24BD2E848B7C6277AE296E:
  description: "The Smart Escrows amendment introduces a new programmability layer to the XRPL, powered by a WebAssembly (WASM) engine. Developers can write custom functions that control when an escrow can be finished."
  xls_url: "https://opensource.ripple.com/docs/xls-100-smart-escrows"

7BB62DC13EC72B775091E9C71BF8CF97E122647693B50C5E87A80DFD6FCFAC50:
  description: "This amendment adds PreviousTxnID and PreviousTxnLgrSequence fields to ledger entries that did not already have them, namely DirectoryNode, Amendments, FeeSettings, NegativeUNL, and AMM."

7CA70A7674A26FA517412858659EBC7EDEEF7D2D608824464E6FDEFD06854E14:
  description: "Adds several fixes to Automated Market Maker code, specifically: Add several invariant checks to ensure that AMMs function as designed; Add rounding to AMM deposit and withdraw to ensure that the AMM's balance meets the invariant:On deposit, tokens out are rounded downward and deposit amount is rounded upward; On withdrawal, tokens in are rounded upward and withdrawal amount is rounded downward."

81BD2619B6B3C8625AC5D0BC01DE17F06C3F0AB95C7C87C93715B87A4FD240D8:
  description: "Creates a structure for aggregating assets from multiple depositors. This is intended to be used with the on-chain Lending Protocol."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/tree/master/XLS-0065-single-asset-vault"

83FD6594FF83C1D105BD2B41D7E242D86ECB4A8220BD9AF4DA35CB0F69E39B2A:
  description: "This amendment fixes a loophole that enabled blacklisted accounts to transfer frozen LP tokens through alternative mechanisms, such as such as payments, checks, offers, or NFTs."

86E83A7D2ECE3AD5FA87AB2195AE015C950469ABF0B72EAACED318F74886AE90:
  description: "This amendment was intended to add support for several types of crypto-conditions from the official crypto-conditions specification for use in EscrowCreate and EscrowFinish transactions."

89308AF3B8B10B7192C4E613E1D2E4D9BA64B2EE2D5232402AE82A6A7220D953:
  description: "Fixes a bug in unused code for estimating the ratio of input to output of individual steps in cross-currency payments."

894646DD5284E97DECFE6674A6D6152686791C4A95F8C132CCA9BAF9E5812FB6:
  description: "Allows multiple transactions to be bundled into a batch that's processed all together."

8CC0774A3BF66D1D22E76BBDA8E8A232E6B6313834301B3B23E8601196AE6455:
  description: "Adds XLS-30 Automated Market Maker (AMM) functionality to the ledger in a way that is integrated with the existing decentralized exchange. Each pair of assets (tokens or XRP) can have up to one AMM in the ledger, which anyone can contribute liquidity to for a proportional share in the earnings and exchange risk. Each AMM instance has a special account to hold its assets and issue \"LP Tokens\" to liquidity providers in proportion to their deposits. Liquidity providers can vote on the AMM's trading fee based on their share of LP Tokens. Users can bid LP Tokens on the right to trade with a discounted trading fee for a limited period of time."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/tree/master/XLS-0030-automated-market-maker#readme"

8EC4304A06AF03BE953EA6EDA494864F6F3F30AA002BABA35869FBB8C6AE5D52:
  description: "Adds flag checks for CredentialCreate, CredentialAccept, CredentialDelete, and SignerListSet transactions. With this amendment enabled, these transactions will return a temINVALID_FLAG error if they include a flag that doesn't exist, or a contradictory combination of flags."

8F81B066ED20DAECA20DF57187767685EEF3980B228E0667A650BAF24426D3B4:
  description: "Changes the way Checks transactions affect account metadata, so that Checks are properly added to the account history of the receiving account. (Specifically, they update the PreviousTxnID and PreviousTxnLedgerSeq fields of the receiving account's AccountRoot object, which can be used to trace the \"thread\" of transactions that affected the account and the objects it owns.)"

9178256A980A86CF3D70D0260A7DA6402AAFE43632FDBCB88037978404188871:
  description: "Fixes an inconsistency in the way transfer fees are calculated between OfferCreate and Payment transaction types. Without this amendment, the holder of the token pays the transfer fee if an offer is executed in offer placement, but the initial sender of a transaction pays the transfer fees for offers that are executed as part of payment processing. With this amendment, the holder of the token always pays the transfer fee, regardless of whether the offer is executed as part of a Payment or an OfferCreate transaction. Offer processing outside of payments is unaffected."

9196110C23EA879B4229E51C286180C7D02166DA712559F634372F5264D0EC59:
  description: "This amendment standardizes the way inner objects (Object-type fields in the canonical binary format) have their formats and default values enforced. This is the same type of check that the fixInnerObjTemplate applies to AMM-related fields, but this amendment applies to all other types of inner objects, namely: DisabledValidator field of the NegativeUNL entry; Members of the Majorities array in the Amendments entry; Members of the Signers array of multi-signed transactions; Members of the SignerEntries array of SignerList ledger entries; Several parts of the XChainBridge amendment :Members of the XChainClaimAttestations array in XChainOwnedClaimID ledger entries; Members of the XChainCreateAccountAttestations array in XChainOwnedCreateAccountClaimID ledger entries; Members of the XChainClaimAttestationBatch array in XChainAddClaimAttestation transactions; Members of the XChainCreateAccountAttestationBatch array in XChainAddClaimAttestation transactions."

93E516234E35E08CA689FA33A6D38E103881F8DCB53023F728C307AA89D515A7:
  description: "Simplifies transaction cost calculations to use XRP directly rather than calculating indirectly in \"fee units\" and translating the results to XRP. Updates all instances of \"fee units\" in the protocol and ledger data to be drops of XRP instead, including: Updates the Fee Voting protocol to use drops of XRP; Updates the FeeSettings ledger entry type. Replaces BaseFee, ReferenceFeeUnits, ReserveBase, and ReserveIncrement fields with BaseFeeDrops, ReserveBaseDrops, and ReserveIncrementDrops; Updates the SetFee transaction type. Replaces BaseFee, ReferenceFeeUnits, ReserveBase, ReserveIncrement fields with BaseFeeDrops, ReserveBaseDrops, ReserveIncrementDrops."

950AE2EA4654E47F04AA8739C0B214E242097E802FD372D24047A89AB1F5EC38:
  description: "Implements a new type of fungible token, called a Multi-Purpose Token (MPT). This token type is optimized to be used for common token use cases such as stablecoins, and are intended to avoid some of the complexity inherent to the XRP Ledger's existing fungible tokens which are stored in bidirectional trust lines. This amendment adds the following: MPToken - represents tokens held by a specific account, including the amount held and who issued them; MPTokenIssuance - records information and settings for a specific issuance of MPT, such as the scale and transfer fee of those tokens; (New) MPTokenIssuanceCreate - Define a new issuance of MPTs; (New) MPTokenIssuanceDestroy - Remove an issuance definition; (New) MPTokenIssuanceSet - Modify an issuance definition; (New) MPTokenAuthorize - Allow an account to hold a specific issuance definition; (Updated) Payment transactions can also send MPTs; (Updated) Clawback transactions can also claw back MPTs if the issuance definition allows clawback; (New) mpt_holders method - Returns a list of accounts that hold a specific MPT issuance; (Updated) ledger_entry method - Can look up MPToken and MPTokenIssuance ledger entry types."

955DF3FA5891195A9DAEFA1DDC6BB244B545DDE1BAA84CBB25D5F12A8DA68A0C:
  description: "This amendment adds Tickets as a way of sending transactions out of the typical sequence number order."

96FD2F293A519AE1DB6F8BED23E4AD9119342DA7CB6BAFD00953D16C54205D8B:
  description: "This amendment adds a \"Price Oracle\" feature to the XRP Ledger, as defined in the XLS-47 specification. A blockchain oracle is a system where a service provides to the blockchain about the outside world, which can then be used by decentralized applications (dApps) that run primarily on or using the blockchain. This price oracle is intended to store pricing information about asset pairs that exist outside of the XRP Ledger so that smart contracts that rely on the XRP Ledger can use this information."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/blob/master/XLS-0047-PriceOracles/README.md"

98433DD001A5737F773D74F8CA2A25A065089C73B2E611C760BAF369E4FECA76:
  description: "This amendment is a collection of fixes for Single Asset Vaults, the Lending Protocol, Automated Market Makers, the permissioned DEX, trust lines, NFTs, MPTs, Escrow, Sponsorship, transaction signing, and permission delegation: Changes VaultClawback to reject a pseudo-account holder with tecPSEUDO_ACCOUNT; Changes VaultDeposit, VaultWithdraw, and VaultClawback to round more precisely, so vault assets can't over- or under-deliver; Changes VaultWithdraw to allow a fixed-share withdrawal to move zero assets from a fully impaired vault rather than failing; Changes the ValidVault invariant so VaultSet isn't blocked when accrued interest alone pushes AssetsTotal over AssetsMaximum; Adds CredentialIDs support to VaultWithdraw; Changes loan lateness, impairment, and default checks to require the due date to have strictly passed; Exempts a loan default from freeze, deep freeze, and MPT lock on the broker-to-vault transfer; Skips the issuer's DefaultRipple check for LoanSet, LoanBrokerCoverWithdraw, and VaultWithdraw when the recipient already holds the asset; Prevents AMMBid from acquiring the auction slot at a zero or dust price on a zero-fee pool; Changes AMMClawback to fully withdraw when the LP-token amount matches the holder's balance, so the last holder can be clawed back completely; Changes AMMClawback to reject amounts that round to zero, bypass the reserve check, and override freeze and deep freeze on AMM trust lines (and 14 more)"

98DECF327BF79997AEC178323AD51A830E457BFC6D454DAF3E46E5EC42DC619F:
  description: "Adjusts the CheckCash transaction so that cashing a Check for an issued token automatically creates a trust line to hold the token. The new behavior is similar to how the OfferCreate transaction behaves when users buy tokens in the decentralized exchange: the automatic trust line has a limit value of 0. This removes the setup step of setting up a trust line before receiving a token via a Check. (Checks that send XRP are unaffected.)"

9F287AED3CDB50A7BD1ACEC24296A30C9B5230CCD136219317AC790E3B884377:
  description: "Allows multiple transactions to be bundled into a batch that's processed all together. This amendment replaces Batch, fixing a critical bug discovered in the original implementation of the feature. Standard: XLS-56."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/tree/master/XLS-0056-batch"

A360E2BFD775A5B0DCE1C36C16DF31B72735A57584FD163655D2F9564F8E7AC8:
  description: "Extends the LendingProtocol and SingleAssetVault amendments with a new closed-ended vault and cash-basis accounting. Closed-ended vaults have a defined lifecycle split into three phases: subscription, investment, and redemption; these phases determine when assets can be deposited into vaults, loans can be originated, and when assets can be redeemed. After the amendment is enabled, new loan brokers can only be created against closed-ended vaults. Cash-basis accounting changes vault accounting to only realize interest as income when payments are actually made, shifting from an instant interest recognition model where all scheduled interest was recognized at the time of loan origination."

A730EB18A9D4BB52502C898589558B4CCEB4BE10044500EE5581137A2E80E849:
  description: "Permissioned domains are controlled environments within the broader ecosystem of the XRP Ledger blockchain. Domains do nothing on their own, but features such as Permissioned DEXes and Lending Protocols can use domains to restrict access, so that traditional financial institutions can offer services on chain while complying with various compliance rules."

AB8D932A5F338903FE5BCBD80B611FFED70839ABA3170E9CE01D947C0EDEDCF2:
  description: "This amendment adds missing DeliveredAmount and delivered_amount metadata fields from direct MPT Payment transactions. Without this amendment, direct MPT payments deliver the full amount but do not have the metadata fields to summarize how much was delivered."

AE35ABDEFBDE520372B31C957020B34A7A4A9DC3115A69803A44016477C84D6E:
  description: "Amendment fixNFTokenRemint would change the way NFT sequence numbers are constructed to prevent a situation where the same NFT could be minted more than once with the same sequence number, creating a possible collision scenario. This amendment would change the construction of NFT sequence numbers to: Create a new AccountRoot field, FirstNFTSequence, that stays constant over time. This field is set to the current account sequence when the account issues its first NFT. Otherwise, it is not set; Compute the sequence of a newly minted NFT as FirstNFTSequence + MintedNFTokens (after which, MintedNFTokens increments by 1)."

AE6AB9028EEB7299EBB03C7CBCC3F2A4F5FBE00EA28B8223AA3118A0B436C1C5:
  description: "Allows accounts to delegate some permissions to other accounts."

AF8DF7465C338AE64B1E937D6C8DA138C0D63AD5134A68792BBBE1F63356C422:
  description: "Improves the payment engine's calculations for finding the most cost-efficient way to execute a cross-currency transaction."

B2A4DB846F0891BF2C76AB2F2ACC8F5B4EC64437135C6E56F3F859DE5FFD5856:
  description: "This amendment expands the maximum signer list size and allows each signer to have optional data associated with it. The additional data can be used to identify the signer, which may be useful for smart contracts, or for identifying who controls a key in a large organization: for example, you could store an IPv6 address or the identifier of a Hardware Security Module (HSM)."

B32752F7DCC41FB86534118FC4EEC8F56E7BD0A7DB60FD73F93F257233C08E3A:
  description: "Fix a bug where NFT transfer fees could bypass certain limitations on receiving tokens, specifically: Prevent an NFT issuer from receiving fungible tokens as transfer fees if the fungible tokens' issuer uses authorized trust lines and the NFT issuer's trust line is not authorized; Prevent an NFT issuer from receiving fungible tokens as transfer fees on a deep-frozen trust line."

B4D44CC3111ADD964E846FC57760C8B50FFCD5A82C86A72756F6B058DDDF96AD:
  description: "Correctly implements a limit on transfer fees to a 100% fee, represented by a maximum TransferRate value of 2000000000. (A 100% fee in this case means you must send 2 units of the token for every 1 unit you want to deliver.) Without the amendment, the effective limit is a TransferRate value of 232-1, for approximately a 329% fee."

B4E4F5D2D6FB84DF7399960A732309C9FD530EAE5941838160042833625A6076:
  description: "Implements a \"Negative UNL\" system, where the network can track which validators are temporarily offline and disregard those validators for quorum calculations. This can improve the ability of the network to make progress during periods of network instability."

B6B3EEDC0267AB50491FDC450A398AF30DBCD977CECED8BEF2499CAB5DAC19E2:
  description: "This amendment fixes an issue where certain Offers, when almost completely consumed, have a much lower exchange rate than when they were first placed. This occurs when the remaining amounts of one or both assets are so small that they cannot be rounded to a similar ratio as when the Offer was placed."

B9E739B8296B4A1BB29BE990B17D66E21B62A300A909F25AC55C22D6C72E1F9D:
  description: "Adds tracking by destination account to escrows. Without this amendment, pending escrows are only tracked by sender. This amendment makes it possible to look up pending escrows by the destination address using the account_objects method, excluding any pending escrows that were created before this amendment became enabled. This amendment also makes EscrowCreate transactions appear in the destination's transaction history, as viewed with the account_tx method."

BE1F90581635DBCEBFC4678C4B54FEDDC1A17B50FD02CFE765A4132A342126AC:
  description: "The Sponsor amendment removes onboarding friction by allowing companies, token issuers, and other entities to subsidize transaction costs and reserve requirements for end users. Sponsors can co-sign transactions or pre-fund sponsorships, covering fees and reserves, while sponsees retain full control of their accounts and keys."
  xls_url: "https://opensource.ripple.com/docs/xls-68-sponsored-fees-and-reserves"

BE2D87DF21B690ED1497B593FDC013CC04276302380B1BD50A033DCF8DEFB2EB:
  description: "Extends the XRPL's Decentralized Exchange to natively support Multi-Purpose Tokens (MPTs) as a tradeable asset class. MPTs can be paired with XRP, Trust Line tokens, or other MPTs across existing DEX transactions such as OfferCreate, Payment, AMM, and Checks."
  xls_url: "https://opensource.ripple.com/docs/xls-82-mpt-dex"

C1B8D934087225F509BEB5A8EC24447854713EE447D277F69545ABFA0E0FD490:
  description: "This amendment was replaced by the TicketBatch amendment."

C1CE18F2A268E6A849C27B3DE485006771B4C01B2FCEC4F18356FE92ECD6BB74:
  description: "Adds functionality to update the URI field of an NFToken ledger entry. This amendment introduces a new transaction type and NFTokenMint flag: NFTokenModify: New transaction type that updates the URI field of an NFT; tfMutable: New flag that enables authorized accounts to modify the URI of an NFT. This flag must be enabled when the NFT is initially minted."

C393B3AEEBF575E475F0C60D5E4241B2070CC4D0EB6C4846B1A07508FAEFC485:
  description: "This amendment fixes an issue with accessing the AMM sfTradingFee and sfDiscountedFee fields in the inner objects of sfVoteEntry and sfAuctionSlot."

C4483A1896170C66C098DEA5B0E024309C60DC960DE5F01CD7AF986AA3D9AD37:
  description: "Fixes a bug where accounts can set their regular key pair to match their master key pair, but cannot send transactions signed by the key if the master key is disabled."

C6970A8B603D8778783B61C0D445C23D1633CCFAEF0D43E7DBCD1521D34BD7C3:
  description: "Changes the hash tree structure used to represent a ledger. The new structure is more compact and efficient than the previous version. This affects how ledger hashes are calculated, but has no other user-facing consequences."

C7981B764EC4439123A86CC7CCBA436E9B3FF73B3F10A0AE51882E404522FC41:
  description: "This amendment fixes a bug that can cause NFT directories to have missing links in the middle of the directory chain. It also introduces invariant checks that can prevent similar types of corruption from occurring in the future, and introduces a new transaction type: LedgerStateFix transactions can be used to repair corruptions in ledger data. With this amendment enabled, you can use a LedgerStateFix transaction to repair a broken link in NFT directories. In the case that future bugs cause new types of ledger corruption, this transaction type can be extended to repair the other types of corruption as well."

C98D98EE9616ACD36E81FDEB8D41D349BF5F1B41DD64A0ABC1FE9AA5EA267E9C:
  description: "Adds cross-chain bridges, enabling the transfer of digital assets between networks (for example, between Mainnet and a sidechain). Standards draft: XLS-0038 Cross-Chain Bridge."
  xls_url: "https://github.com/XRPLF/XRPL-Standards/blob/master/XLS-0038-cross-chain-bridge/README.md"

CA7C02118BA27599528543DFE77BA6838D1B0F43B447D4D7F53523CE6A0E9AC2:
  description: "Enforces reserved flag ranges on some transaction types that did not correctly enforce them already. Transactions of the affected types are now considered invalid if they enable undefined or unknown flags, or flags from the reserved range. (Transactions unaffected by this change already correctly enforce the same rules.)"

CC5ABAE4F3EC92E94A59B1908C2BE82D2228B6485C00AFF8F22DF930D89C194E:
  description: "Sorts the entries in DirectoryNode ledger objects and fixes a bug that occasionally caused pages of owner directories not to be deleted when they should have been."

D3456A862DC07E382827981CA02E21946E641877F19B8889031CC57FDCAC83E2:
  description: "Prevents new payment channels from being created with a CancelAfter time that is before the current ledger. Instead, the PaymentChannelCreate transaction fails with the result code tecEXPIRED."

D8ED3BE0B2673496CB49DE8B5588C8805DF7B1DE203F38FE0367ACE703D36C0F:
  description: "This amendment adds several new invariants to protect the ledger against bugs in transaction processing. The developers intend to set it as open for voting after a set of several invariants are implemented. The invariants included are as follows: When deleting an account, ensure that certain types of ledger entries are also deleted, including that account's DirectoryNode, SignerList, NFTokenPage, and AMM directories, if any, are deleted with it."

DA1BD556B42D85EA9C84066D028D355B52416734D3283F85E216EA5DA6DB7E13:
  description: "This amendment was replaced by the Escrow amendment."

DAF3A6EB04FA5DC51E8E4F23E9B7022B693EFA636F23F22664746C77B5786B23:
  description: "This amendment enables issuers to deep freeze trustlines from interacting with payments, offers, AMMs, and the DEX. This prevents deep frozen accounts from sending and receiving frozen assets. With this amendment, four new flags are introduced: RippleState flags:lsfLowDeepFreeze; lsfHighDeepFreeze."

DB432C3A09D9D5DFC7859F39AE5FF767ABC59AED0A9FB441E83B814D8946C109:
  description: "Adds to the ledger Decentralized Identifier (DID) functionality that conforms to the World Wide Web Consortium standard. DIDs provide a digital identity, not dependent on a centralized authority and controlled by the DID subject."

DC9CA96AEA1DCF83E527D1AFC916EFAF5D27388ECA4060A88817C1238CAEE0BF:
  description: "Adds sanity checks to transaction processing to ensure that certain conditions are always met. This provides an extra, independent layer of protection against bugs in transaction processing that could otherwise cause exploits and vulnerabilities in the XRP Ledger. Future versions of rippled may add more invariants without additional amendments."

DF8B4536989BDACE3F934F29423848B9F1D76D09BE6A1FCFE7E7F06AA26ABEAD:
  description: "Removes the tfTrustLine setting on non-fungible tokens, to protect against a denial of service attack on issuers using this flag. With this amendment enabled, a NFTokenMint transaction with the tfTrustLine flag enabled is considered invalid and cannot be confirmed by consensus; new NFToken objects cannot be minted with the flag."

E2E6F2866106419B88C50045ACE96368558C345566AC8F2BDF5A5B5587F0E6FA:
  description: "Fixes a minor bug in transaction processing that causes some payments to fail when they should be valid. Specifically, during payment processing, some payment steps that are expected to produce a certain amount of currency may produce a microscopically different amount, due to a loss of precision related to floating-point number representation. When this occurs, those payments fail because they cannot deliver the exact amount intended. The fix1368 amendment corrects transaction processing so payments can no longer fail in this manner."

EE3CF852F0506782D05E65D49E5DCC3D16D50898CD1B646BAE274863401CC3CE:
  description: "Modifies the process of minting NFTs so that you can also create a sell offer for the token at the same time."

F1ED6B4A411D8B872E65B9DCB4C8B100375B0DD3D62D07192E011D6D7F339013:
  description: "This amendment removes two trust lines from an account to itself that were created due to an old bug (both on 2013-05-07). When the amendment becomes enabled, it deletes trust lines with the IDs 2F8F21EFCAFD7ACFB07D5BB04F0D2E18587820C7611305BB674A64EAB0FA71E1 and 326035D5C0560A9DA8636545DD5A1B0DFCFF63E68D491B5522B767BB00564B1A if they exist. After doing so, the amendment does nothing else."

F64E1EABBE79D55B3BB82020516CEC2C582A98A6BFE20FBE9BB6A0D233418064:
  description: "Adds a new account flag, DepositAuth, which lets an account strictly reject any incoming money from transactions sent by other accounts. Businesses can use this flag to comply with strict regulations that require due diligence before receiving money from any source."

FBD513F1B893AC765B78F250E6FFA6A11B573209D1842ADC787C850696741288:
  description: "Changes the result codes returned by two transaction types: Changes the OfferCreate transaction to return a new result code, tecKILLED, if the offer used the tfFillOrKill flag and was killed. Without this amendment, the offer is killed but the transaction result is tesSUCCESS; Changes the TrustSet transaction to fail with tecNO_PERMISSION if it tries to enable the No Ripple flag but cannot because the trust line has a negative balance. Without this amendment, the transaction does not enable the No Ripple flag, but the transaction result is tesSUCCESS nonetheless."

FF2D1E13CF6D22427111B967BD504917F63A900CECD320D6FD3AC9FA90344631:
  description: "Fixes an issue where the order of asset pair data is different from when a price oracle is created versus when it is updated."
