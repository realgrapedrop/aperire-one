<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Aperire One">
  <!-- The double-ring mark in its bold cut: this file's only consumers are
       the ~22px header <img>s. At that size a stroke needs ~10 viewBox
       units to make one on-screen pixel, so the inner ring is drawn at 11
       (second thickening, 2026-08-13 — at 6 it was invisible without
       zoom). Same art as the favicon: weighted to be legible small. The
       login page's inline copy keeps the display weights for the large
       sign-in bloom. -->
  <circle cx="120" cy="120" r="82" fill="none" stroke="#1f6feb" stroke-width="16" stroke-linecap="round" stroke-dasharray="408 105" transform="rotate(-52 120 120)"/>
  <circle cx="120" cy="120" r="62" fill="none" stroke="#1f6feb" stroke-width="11" opacity="0.75" stroke-linecap="round" stroke-dasharray="290 100" transform="rotate(128 120 120)"/>
  <g fill="none" stroke="#58a6ff" stroke-width="19" stroke-linecap="round">
    <path d="M86 100 Q120 150 154 100"/>
    <path d="M86 148 Q120 96 154 148"/>
  </g>
  <circle cx="120" cy="122" r="10" fill="#dcefff"/>
</svg>
