<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Helvetica, Arial, sans-serif">
  <!-- The Advisor's trust journey, animated. One question loops through the
       system every 16 seconds: asked, prepared, reasoned about, answered —
       and when it becomes an action, stopped at a human passkey before one
       finite verb reaches the node. The red path is the point of the whole
       drawing: there isn't one.
       Layout (operator, 2026-08-21): the model sits level with the Advisor,
       the node level with the approval and straight under the model so the
       NO PATH line is vertical, and the executor sits under the approval. -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <style>
      .box  { fill: #fff; stroke-width: 2.5; }
      .purple { stroke: #8e44ad; } .orange { stroke: #e67e22; } .cyan { stroke: #17a2b8; }
      .navy { stroke: #1f3a5f; } .green { stroke: #2e8b57; } .grey { stroke: #9a9a9a; }
      .t  { font-size: 19px; fill: #222; text-anchor: middle; font-weight: bold; }
      .ts { font-size: 14px; fill: #444; text-anchor: middle; }
      .tn { font-size: 12.5px; fill: #666; text-anchor: middle; }
      .l  { font-size: 13.5px; fill: #555; }
      .lc { font-size: 13.5px; fill: #555; text-anchor: middle; }
      .lr { font-size: 14px; fill: #c0392b; text-anchor: middle; font-weight: bold; }
      .a  { fill: none; stroke: #333; stroke-width: 1.6; marker-end: url(#ah); }
      .ad { fill: none; stroke: #999; stroke-width: 1.3; stroke-dasharray: 3 4; marker-end: url(#ahg); }
      .blocked { fill: none; stroke: #c0392b; stroke-width: 2; stroke-dasharray: 8 6; }
      .foot { font-size: 15px; fill: #444; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1400" height="780" fill="#fff"/>

  <!-- ── row 1: the conversation ───────────────────────────────────── -->
  <rect class="box green" x="40" y="130" width="200" height="100" rx="12"/>
  <text class="t"  x="140" y="160">YOU</text>
  <text class="ts" x="140" y="182">the operator</text>
  <text class="tn" x="140" y="202">passkey in hand —</text>
  <text class="tn" x="140" y="219">nothing acts without it</text>

  <rect class="box green" x="300" y="130" width="220" height="100" rx="12"/>
  <text class="t"  x="410" y="160">DASHBOARD</text>
  <text class="ts" x="410" y="182">session gate</text>
  <text class="tn" x="410" y="202">who you are, stamped</text>
  <text class="tn" x="410" y="219">server-side, every turn</text>

  <rect class="box purple" x="580" y="100" width="270" height="160" rx="12"/>
  <text class="t"  x="715" y="135">THE ADVISOR</text>
  <text class="ts" x="715" y="160">aperire-advisord</text>
  <text class="tn" x="715" y="184">a fixed read menu, budgets,</text>
  <text class="tn" x="715" y="202">checked parameters</text>
  <text class="tn" x="715" y="226">secrets stripped BELOW it —</text>
  <text class="tn" x="715" y="244">it can't leak what it never holds</text>

  <rect class="box cyan" x="1010" y="100" width="340" height="160" rx="12"/>
  <text class="t"  x="1180" y="135">THE MODEL — YOUR PICK</text>
  <text class="ts" x="1180" y="160">cloud API or local, your call</text>
  <text class="tn" x="1180" y="184">its key is sealed to this host</text>
  <text class="tn" x="1180" y="202">it receives prepared text only</text>
  <text class="tn" x="1180" y="222">no shell &#183; no credentials</text>
  <text class="tn" x="1180" y="240">no network path into your systems</text>

  <!-- ── row 2: the human, and the machine the story is about ──────── -->
  <rect class="box orange" x="580" y="360" width="280" height="130" rx="12"/>
  <text class="t"  x="720" y="395">YOUR APPROVAL</text>
  <text class="ts" x="720" y="420">confirm code + your passkey</text>
  <text class="tn" x="720" y="444">the node itself verifies the human —</text>
  <text class="tn" x="720" y="462">no passkey, no run, no exceptions</text>

  <rect class="box navy" x="1010" y="360" width="340" height="130" rx="12"/>
  <text class="t"  x="1180" y="398">YOUR NODE</text>
  <text class="ts" x="1180" y="424">validator keys never leave it</text>
  <text class="tn" x="1180" y="448">not readable by the Advisor,</text>
  <text class="tn" x="1180" y="466">the model, or the wrapper</text>

  <!-- ── row 3: the only hands ─────────────────────────────────────── -->
  <rect class="box purple" x="580" y="560" width="280" height="110" rx="12"/>
  <text class="t"  x="720" y="592">EXECUTOR + WRAPPER</text>
  <text class="ts" x="720" y="615">root socket, no sudo, finite verbs</text>
  <text class="tn" x="720" y="637">a dated backup before any change,</text>
  <text class="tn" x="720" y="654">its path on the record</text>

  <rect class="box grey" x="40" y="700" width="1310" height="52" rx="10"/>
  <text class="foot" x="695" y="732">HASH-CHAINED LEDGER &#8212; every question, refusal, proposal, approval and run &#183; each entry chained to the last &#183; tampering breaks the chain, loudly</text>

  <!-- ── the arrows ────────────────────────────────────────────────── -->
  <line class="a" x1="242" y1="160" x2="298" y2="160"/>
  <line class="a" x1="522" y1="160" x2="578" y2="160"/>
  <line class="a" x1="298" y1="205" x2="242" y2="205"/>
  <line class="a" x1="578" y1="205" x2="522" y2="205"/>
  <text class="lc" x="410" y="112">ask &#8594; &#183; &#8592; answer</text>

  <line class="a" x1="852" y1="150" x2="1008" y2="150"/>
  <text class="lc" x="930" y="95">prepared context &#8212;</text>
  <text class="lc" x="930" y="112">secrets already gone</text>
  <line class="a" x1="1008" y1="205" x2="852" y2="205"/>
  <text class="lc" x="930" y="240">reply &#8212; validated,</text>
  <text class="lc" x="930" y="257">never executed</text>

  <line class="a" x1="715" y1="262" x2="718" y2="358"/>
  <text class="l" x="455" y="300">an action? it is only ever a PROPOSAL —</text>
  <text class="l" x="455" y="318">the Advisor cannot approve or run anything</text>

  <line class="a" x1="720" y1="492" x2="720" y2="558"/>
  <text class="l" x="765" y="520">only after</text>
  <text class="l" x="765" y="537">the passkey</text>

  <line class="a" x1="862" y1="600" x2="1046" y2="494"/>
  <text class="l" x="960" y="580">one finite verb,</text>
  <text class="l" x="960" y="597">nothing else fits</text>

  <!-- The whole point: the model has no route to the node. -->
  <line class="blocked" x1="1180" y1="262" x2="1180" y2="356"/>
  <line x1="1153" y1="292" x2="1207" y2="328" stroke="#c0392b" stroke-width="4"/>
  <line x1="1207" y1="292" x2="1153" y2="328" stroke="#c0392b" stroke-width="4"/>
  <text class="lr" x="1300" y="296">NO PATH</text>
  <text class="tn" x="1300" y="316">the model can never</text>
  <text class="tn" x="1300" y="333">reach your node,</text>
  <text class="tn" x="1300" y="350">or ever approve</text>

  <!-- Ledger tick lines -->
  <line class="ad" x1="590" y1="262" x2="500" y2="698"/>
  <line class="ad" x1="585" y1="492" x2="520" y2="698"/>
  <line class="ad" x1="1180" y1="492" x2="1100" y2="698"/>
  <text class="tn" x="440" y="600">every hop lands</text>
  <text class="tn" x="440" y="617">in the ledger</text>

  <!-- ── the animation: one question, one 16s loop ─────────────────── -->
  <!-- 1. the question travels: you -> dashboard -> advisor -->
  <circle r="6" fill="#2e8b57" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.13;1" path="M145,160 L845,160"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.01;0.02;0.12;0.13;1"/>
  </circle>
  <!-- 2. prepared context to the model -->
  <circle r="6" fill="#17a2b8" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.15;0.24;1" path="M852,150 L1008,150"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.15;0.16;0.23;0.24;1"/>
  </circle>
  <!-- 3. the reply comes back -->
  <circle r="6" fill="#17a2b8" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.26;0.35;1" path="M1008,205 L852,205"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.26;0.27;0.34;0.35;1"/>
  </circle>
  <!-- 4. the answer reaches you -->
  <circle r="6" fill="#2e8b57" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.37;0.49;1" path="M845,205 L145,205"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.37;0.38;0.48;0.49;1"/>
  </circle>
  <!-- 5. this time it was an action: the proposal drops to the gate -->
  <circle r="6" fill="#e67e22" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.52;0.59;1" path="M715,262 L718,358"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.58;0.59;1"/>
  </circle>
  <!-- 6. the gate lights while the passkey is touched -->
  <rect x="580" y="360" width="280" height="130" rx="12" fill="none" stroke="#e67e22" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;0;1;0;0" keyTimes="0;0.60;0.62;0.64;0.66;0.68;1"/>
  </rect>
  <!-- 7. the approved run drops to the wrapper -->
  <circle r="6" fill="#8e44ad" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.70;0.76;1" path="M720,492 L720,558"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.70;0.71;0.75;0.76;1"/>
  </circle>
  <!-- 8. one finite verb reaches the node -->
  <circle r="6" fill="#1f3a5f" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.78;0.84;1" path="M862,600 L1046,494"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.78;0.79;0.83;0.84;1"/>
  </circle>
  <!-- 9. and the model tries the direct route, once per loop, and cannot -->
  <circle r="6" fill="#c0392b" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;0;0" keyTimes="0;0.87;0.93;0.98;1" path="M1180,265 L1180,288"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.87;0.88;0.97;0.98;1"/>
  </circle>
  <rect x="1140" y="280" width="80" height="60" rx="8" fill="none" stroke="#c0392b" stroke-width="4" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;1;0;1;0;0" keyTimes="0;0.92;0.93;0.945;0.96;0.98;1"/>
  </rect>
  <!-- ledger ticks: a dot lands as each stage completes -->
  <circle r="4" fill="#666" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.13;0.18;1" path="M590,262 L500,698"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;.8;.8;0;0" keyTimes="0;0.13;0.14;0.17;0.18;1"/>
  </circle>
  <circle r="4" fill="#666" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.66;0.71;1" path="M585,492 L520,698"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;.8;.8;0;0" keyTimes="0;0.66;0.67;0.70;0.71;1"/>
  </circle>
  <circle r="4" fill="#666" opacity="0">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.84;0.89;1" path="M1180,492 L1100,698"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      values="0;0;.8;.8;0;0" keyTimes="0;0.84;0.85;0.88;0.89;1"/>
  </circle>
</svg>
